name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Clean Project Environment
        run: |
          # 1. Buat file .env kosong agar plugin secrets tidak error
          touch .env

          # 2. Samakan versi distributionUrl di gradle-wrapper ke 8.11.1
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 3. Pastikan versi AGP adalah 8.8.2 (kompatibel penuh dengan Gradle 8.11.1)
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = "[0-9.]*"/agp = "8.8.2"/g' gradle/libs.versions.toml
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i "s/version '9\.[0-9.]*'/version '8.8.2'/g" app/build.gradle.kts
            sed -i 's/version "9\.[0-9.]*"/version "8.8.2"/g' app/build.gradle.kts
            # 4. Pastikan compileSdk menggunakan integer 36 standar
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' app/build.gradle.kts
            sed -i 's/compileSdk {.*}/compileSdk = 36/g' app/build.gradle.kts
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
