name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            find "$ANDROID_SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Menggunakan sdkmanager: $SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_SDK_ROOT/licenses"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail

          touch .env

          if [ -f app/build.gradle.kts ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' \
              app/build.gradle.kts

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+/compileSdk 35/g' \
              app/build.gradle.kts
          fi

          if [ -f gradle/libs.versions.toml ]; then
            sed -i -E \
              's/(agp[[:space:]]*=[[:space:]]*")[0-9.]+"/\18.7.0"/g' \
              gradle/libs.versions.toml
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
