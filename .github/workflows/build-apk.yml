name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android Licenses & Prepare Project
        run: |
          touch .env

          # 1. Tulis langsung signature hash lisensi Android SDK resmi agar 100% diterima
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8564832314f0c05869d0aa533b99b94ee6d61779" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # 2. Pastikan compileSdk = 35 standar
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' app/build.gradle.kts
          sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts

          # 3. Samakan versi AGP ke 8.8.2 jika masih ada versi 9.x di repositori
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = "[0-9.]*"/agp = "8.8.2"/g' gradle/libs.versions.toml
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i "s/version '9\.[0-9.]*'/version '8.8.2'/g" app/build.gradle.kts
            sed -i 's/version "9\.[0-9.]*"/version "8.8.2"/g' app/build.gradle.kts
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
