name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          api-level: 35
          build-tools-version: "35.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare Android Project
        shell: bash
        run: |
          touch .env
          # Pastikan compileSdk sesuai SDK yang tersedia di runner
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/compileSdk *= *[0-9]*/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts
          fi

          # Menyamakan AGP versi yang kompatibel
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = \"[0-9.]*\"/agp = \"8.8.2\"/g' gradle/libs.versions.toml
          fi

          if [ -f app/build.gradle.kts ]; then
            sed -i "s/version '9\\.[0-9.]*'/version '8.8.2'/g" app/build.gradle.kts
            sed -i 's/version \"9\\.[0-9.]*\"/version \"8.8.2\"/g' app/build.gradle.kts
          fi

      - name: Build Debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
