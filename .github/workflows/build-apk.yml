name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 36)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare .env
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env; else touch .env; fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # Debug aid: publish a condensed failure log to the ci-logs branch so it can be
      # read through api.github.com (Actions log/artifact downloads are network-blocked
      # from the agent sandbox). Remove this step once the build is green.
      - name: Publish condensed failure log (debug)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== RUN: ${{ github.run_number }} / ${{ github.sha }} ==="
            echo ""
            echo "=== WHAT WENT WRONG ==="
            grep -n "What went wrong" -A 45 build.log | head -70
            echo ""
            echo "=== e: ERRORS (unique) ==="
            grep -E "^e: " build.log | sort -u | head -60
            echo ""
            echo "=== FAILED TASKS ==="
            grep -E "Task .* FAILED|Execution failed for task" build.log | sort -u | head -30
            echo ""
            echo "=== Caused by ==="
            grep -n "Caused by" -A 6 build.log | head -80
            echo ""
            echo "=== LAST 250 LINES ==="
            tail -n 250 build.log
          } > build-fail.txt 2>&1 || true

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p logs
          cp build-fail.txt "logs/run-${{ github.run_number }}.txt"
          git add -f "logs/run-${{ github.run_number }}.txt"
          git commit -m "build failure log for run ${{ github.run_number }}" || exit 0
          git push -f origin ci-logs
